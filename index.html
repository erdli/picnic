<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송도 바다 피크닉 예약</title>
    <meta name="description" content="부산 송도 해수욕장에서 즐기는 프리미엄 피크닉 세트 대여 서비스">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 1. Home Screen -->
        <section id="page-home" class="page active">
            <div class="hero-bg">
                <div class="glass-panel">
                    <h1 class="logo-font">Songdo Picnic</h1>
                    <p>송도 바다와 케이블카가 보이는 완벽한 피크닉</p>
                    
                    <div class="booking-widget">
                        <div class="input-group">
                            <label>대여 날짜</label>
                            <input type="date" id="booking-date">
                        </div>
                        <button id="btn-go-products" class="btn-primary">피크닉 세트 보러가기</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. Product List Screen -->
        <section id="page-products" class="page">
            <header>
                <h2>피크닉 세트</h2>
                <div class="filters">
                    <button class="filter-btn active">인기순</button>
                    <button class="filter-btn">가격순</button>
                </div>
            </header>
            <div class="product-grid" id="product-list-container">
                <!-- Products injected by JS -->
            </div>
        </section>

        <!-- 3. Product Details Screen -->
        <section id="page-details" class="page">
            <header>
                <button class="btn-back" onclick="navigate('products')">← 뒤로</button>
            </header>
            <div class="details-content" id="product-details-container">
                <!-- Details injected by JS -->
            </div>
        </section>

        <!-- 4. Checkout Screen -->
        <section id="page-checkout" class="page">
            <header>
                <button class="btn-back" onclick="navigate('details')">← 뒤로</button>
                <h2>예약 정보 입력</h2>
            </header>
            <div class="checkout-form glass-card">
                <div class="form-group">
                    <label>예약자 이름</label>
                    <input type="text" id="user-name" placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label>연락처</label>
                    <input type="tel" id="user-phone" placeholder="010-1234-5678">
                </div>
                
                <div class="summary-box">
                    <h3>결제 요약</h3>
                    <div id="checkout-summary"></div>
                </div>

                <button id="btn-pay" class="btn-primary btn-large">결제하기</button>
            </div>
        </section>

        <!-- 5. Success Screen -->
        <section id="page-success" class="page">
            <div class="success-content glass-card center-text">
                <h2>🎉 예약이 완료되었습니다!</h2>
                <p>송도 해수욕장 앞 대여 매장에서 픽업해 주세요.</p>
                
                <div class="barcode-box">
                    <p class="small-text">픽업용 바코드</p>
                    <div class="barcode-mock">||| || ||| | || |||</div>
                    <p id="booking-id" class="bold-text"></p>
                </div>

                <div class="map-mock">
                    <span>📍 매장 위치 약도</span>
                </div>

                <button onclick="navigate('home')" class="btn-secondary mt-2">처음으로 돌아가기</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
